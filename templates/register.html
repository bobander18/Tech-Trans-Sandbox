{% extends "base.html" %}

{% block content %}

<h1>Register</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">
    <input name="username" placeholder="Username">

    <input
        name="password"
        type="password"
        placeholder="Password"
    >

    <button>Create Account</button>
</form>

{% endblock %}
